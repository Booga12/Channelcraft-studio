<!doctype html>
<!-- The start-up splash (#61): its own small window, shown before the app window while the app
     loads behind it. The brush logo paints itself in; after at least 4 seconds, once the app is
     ready, the card fades out and the app window appears (see src-tauri/src/splash.rs).
     The logo below is src/lib/splashLogo.ts's paintedLogo('aurora'); splashLogo.test.ts checks it. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChannelCraft Studio</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        user-select: none;
        cursor: default;
        font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      }
      .card {
        position: absolute;
        inset: 14px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border-radius: 18px;
        background: radial-gradient(120% 90% at 50% 0%, #1d2030 0%, #111218 60%, #0c0d12 100%);
        border: 1px solid rgb(255 255 255 / 0.08);
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.45);
        color: #f3f4f7;
        transition: opacity 0.45s ease, transform 0.45s ease;
      }
      .card.out {
        opacity: 0;
        transform: scale(0.97);
      }
      .logo {
        width: 116px;
        height: 116px;
        margin-bottom: 14px;
        filter: drop-shadow(0 10px 26px rgb(0 0 0 / 0.45));
      }
      .logo svg {
        width: 100%;
        height: 100%;
        overflow: visible;
      }
      /* The tile pops in, then each stroke is painted from its blob to its drip. */
      .logo .tile {
        transform-origin: 512px 512px;
        animation: pop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
      }
      .logo .draw {
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: paint 1s cubic-bezier(0.55, 0, 0.3, 1) 0.45s forwards;
      }
      .logo .d1 {
        animation-delay: 1.3s;
        animation-duration: 0.8s;
      }
      .name {
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.01em;
        animation: rise 0.6s ease-out 1.7s both;
      }
      .version {
        font-size: 12px;
        color: #9aa0ad;
        min-height: 16px;
        animation: rise 0.6s ease-out 1.85s both;
      }
      .line {
        position: relative;
        width: 150px;
        height: 3px;
        margin-top: 16px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(255 255 255 / 0.1);
        animation: rise 0.6s ease-out 2s both;
      }
      .line span {
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--a), var(--b));
        animation: slide 1.2s ease-in-out infinite;
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: scale(0.7);
        }
      }
      @keyframes paint {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
      }
      @keyframes slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
    </style>
  </head>

    <script>
      // The logo colour picked in Settings > Appearance (the app keeps its settings here too).
      const COLOURS = {"aurora":["#3fd68a","#1fa6c9","#5047d1"],"original":["#2f7cf6","#5a5fe6","#8447d9"],"sunset":["#ff8a3d","#f2477e","#8e3fd6"],"ocean":["#16c2c9","#1f86e0","#2b4fc4"],"synthwave":["#ff3d9a","#a64be8","#22c4f0"],"ember":["#e8344e","#f26a2e","#f7a531"],"berry":["#f0479c","#b23cc4","#6a2fb8"],"lagoon":["#9bdc3c","#2fc79a","#1797b8"],"midnight":["#1d2b64","#2f3d8f","#4c3fa8"],"graphite":["#3a3d46","#24262d","#121318"]};
      let id = 'aurora';
      try {
        id = JSON.parse(localStorage.getItem('ccs.prefs') || '{}').logoColour || id;
      } catch {}
      const stops = COLOURS[id] || COLOURS.aurora;
      const grad = document.querySelector('#logo linearGradient');
      if (grad) grad.innerHTML = stops.map((c, i) => `<stop offset="${(i / (stops.length - 1)).toFixed(2)}" stop-color="${c}"/>`).join('');
      const line = document.getElementById('line');
      line.style.setProperty('--a', stops[0]);
      line.style.setProperty('--b', stops[stops.length - 1]);

      // Long enough for the whole animation, longer if the app takes longer to load.
      const MIN = 4000;
      const t0 = performance.now();
      const tauri = window.__TAURI_INTERNALS__;
      let leaving = false;
      async function check() {
        if (!tauri || leaving) return;
        try {
          const s = await tauri.invoke('splash_state');
          if (s.version) document.getElementById('version').textContent = `Version ${s.version}`;
          if (s.ready && performance.now() - t0 >= MIN) {
            leaving = true;
            document.getElementById('card').classList.add('out');
            setTimeout(() => tauri.invoke('splash_done').catch(() => {}), 450);
            return;
          }
        } catch {}
        setTimeout(check, 200);
      }
      check();
    </script>
