# Publishes a GitHub release whenever the app's version goes up.
#
# On every push to main that touches a version file, this reads the version from package.json.
# If there is no tag v<version> yet, it runs the checks and tests, then builds the Windows
# installer with `pnpm release`: signed for the in-app updater, checked that nothing personal is
# bundled, together with the latest.json that installed copies look for. Both are published as
# release v<version>, so installed copies update themselves, plus a copy of the installer named
# ChannelCraft-Studio-setup.exe for the website's download button.
# The version must be the same in package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY: the contents of the updater signing key
# (%USERPROFILE%\.tauri\channelcraft-studio.key). Without it nothing is published.

name: Release

on:
  push:
    branches: [main]
    paths:
      - package.json
      - src-tauri/tauri.conf.json
      - src-tauri/Cargo.toml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check the three files agree
        id: read
        run: |
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cargo=$(grep -m1 '^version *=' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          echo "package.json: $pkg  tauri.conf.json: $conf  Cargo.toml: $cargo"
          if [ "$pkg" != "$conf" ] || [ "$pkg" != "$cargo" ]; then
            echo "::error::Version numbers don't match. Set the same version in package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml."
            exit 1
          fi
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

      - name: Skip if this version was already released
        id: tag
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION already exists, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$VERSION is new, releasing."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build and publish
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the signing key is there
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so the update can't be signed. Add it under Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type checks and tests
        run: |
          pnpm check
          pnpm exec vitest run
          pnpm build
          cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Build the signed installer and latest.json, and run release checks
        run: pnpm release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dir=src-tauri/target/release/bundle/nsis
          exe=$(ls "$dir"/*_"$VERSION"_x64-setup.exe)
          # The same installer under a name that never changes, so the website can always link to
          # releases/latest/download/ChannelCraft-Studio-setup.exe.
          cp "$exe" "$dir/ChannelCraft-Studio-setup.exe"
          # Made as a draft and only made public once every file is up, so installed copies never
          # see a latest.json without its installer.
          gh release create "v$VERSION" "$exe" "$dir/latest.json" "$dir/ChannelCraft-Studio-setup.exe" \
            --title "ChannelCraft Studio $VERSION" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --draft
          gh release edit "v$VERSION" --draft=false --latest
